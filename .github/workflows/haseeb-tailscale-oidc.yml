name: Haseeb Tailscale OIDC Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/haseeb-tailscale-oidc.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: haseeb-tailscale-oidc-main
  cancel-in-progress: false

jobs:
  tailscale-oidc-check:
    name: Federated identity and tailnet check
    if: github.repository == 'dilshadshahsyed883-cmd/Haseeb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: haseeb-pc
    steps:
      - name: Connect ephemeral Haseeb CI node
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:haseeb-ci
          version: latest

      - name: Verify node is online (no target-side commands)
        shell: bash
        run: |
          set -euo pipefail
          tailscale status --json | python3 -c '
          import json, sys
          status = json.load(sys.stdin)
          if not status.get("Self", {}).get("Online", False):
              raise SystemExit("Haseeb runner is not online in Tailscale")
          print("Haseeb CI federated login OK; ephemeral runner is online")
          '

      - name: Optional private Haseeb PC connectivity check
        shell: bash
        env:
          HASEEB_PC_IP: ${{ vars.HASEEB_PC_TAILSCALE_IP }}
        run: |
          set -euo pipefail
          if [[ -z "${HASEEB_PC_IP}" ]]; then
            echo "PC peer check skipped; set haseeb-pc environment variable HASEEB_PC_TAILSCALE_IP to opt in."
            exit 0
          fi
          echo "Checking Tailscale peer discovery via TSMP (not an access-policy proof):"
          if timeout 20s tailscale ping --tsmp -c 1 --timeout 12s "${HASEEB_PC_IP}"; then
            echo "Tailscale TSMP peer communication succeeded."
          else
            echo "::warning::Tailscale TSMP peer communication failed; peer may be offline or unreachable."
          fi

          echo "Checking actual ICMP reachability through the Haseeb-only icmp:* grant:"
          if timeout 20s tailscale ping --icmp -c 1 --timeout 12s "${HASEEB_PC_IP}"; then
            echo "Haseeb Windows PC ICMP ping PASS; Tailscale access-policy path verified."
          else
            echo "::error::Haseeb Windows PC ICMP ping FAILED. Check PC online status, ACL, or Windows firewall. No PC commands executed."
            exit 1
          fi
