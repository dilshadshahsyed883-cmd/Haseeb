name: Haseeb Windows Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows tests and app packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CI selector against real successful main run
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "dilshadshahsyed883-cmd/Haseeb"
          $currentSha = (& gh api --method GET "repos/$repo/branches/main" --jq ".commit.sha").Trim()
          if ($LASTEXITCODE -ne 0 -or $currentSha -notmatch '^[a-f0-9]{40}$') { throw "Cannot read trusted main SHA" }
          $uri = "repos/$repo/actions/workflows/build-windows.yml/runs?branch=main&head_sha=$currentSha&per_page=100"
          $output = & gh api --method GET -H "Accept: application/vnd.github+json" $uri
          if ($LASTEXITCODE -ne 0) { throw "CI run REST query failed" }
          $runs = @( (($output -join "`n") | ConvertFrom-Json).workflow_runs )
          $match = @($runs | Where-Object {
            $_.head_sha -eq $currentSha -and
            $_.head_branch -eq "main" -and
            $_.conclusion -eq "success" -and
            $_.status -eq "completed" -and
            $_.event -in @("push", "workflow_dispatch")
          })
          if ($match.Count -eq 0) { throw "API did not locate matching successful main run $currentSha" }
          Write-Host "PASS: exact SHA GitHub CI lookup returned $($match.Count) trusted successful main runs"
      - name: Haseeb deployment system health and runner tests
        shell: powershell
        run: |
          & ".\ops\windows\Run-HaseebSync.ps1" -SelfTest
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Updater runner self-test failed" }
          & ".\ops\windows\Status-Haseeb.ps1" -SelfTest
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Deployment status self-test failed" }
      - name: Validate app manifests
        run: python tools/haseeb.py validate
      - name: Desktop app headless smoke test
        run: python apps/haseeb_control/main.py --self-test
      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem ops/windows -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Host "Syntax error in $($_.Name)"
              $hasErrors = $true
            }
          }
          if ($hasErrors) { exit 1 }
      - name: Install pinned Windows audio engine
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Bundle FFmpeg inside Audio Cutter release
        run: python tools/prepare_audio_cutter.py
      - name: Audio Cutter real MP3 trimming smoke test
        run: python apps/audio_cutter/main.py --self-test
      - name: Build packages
        run: python tools/haseeb.py package
      - name: Upload build bundle (not from PRs)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: haseeb-windows-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30
